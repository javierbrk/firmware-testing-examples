# Plantilla: ajustar puerto serie, credenciales y control de energía a tu DUT.
imports:
  - strategies/shell_strategy.py
targets:
  main:
    resources:
      RawSerialPort:
        port: /dev/ttyUSB0
        speed: 115200
    drivers:
      ManualPowerDriver: {}      # reemplazar por NetworkPowerPort, USBPowerPort, etc.
      SerialDriver: {}
      ShellDriver:
        prompt: 'root@[\w-]+:[^ ]+ '
        login_prompt: ' login: '
        username: root
      ShellStrategy: {}
